name: FRIDAY Android CI

on:
  push:
    paths: ["friday/**", ".github/workflows/friday-android.yml"]
  pull_request:
    paths: ["friday/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: friday
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lint

      - name: Unit + Robolectric integration + Compose smoke tests
        run: ./gradlew test

      - name: Build debug and release APK
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-test-reports
          path: |
            friday/app/build/reports/tests
            friday/app/build/reports/lint-results-debug.html

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: friday-apk
          path: |
            friday/app/build/outputs/apk/debug/app-debug.apk
            friday/app/build/outputs/apk/release/app-release.apk
